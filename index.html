<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>13ou22 - já virou</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; text-align:center; background:#111; color:#eee; overflow:hidden; touch-action: manipulation; }
    .container { width:100vw; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding: 10px; box-sizing: border-box; }
    canvas { max-width:100%; max-height:75vh; border:5px solid #333; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.4); box-sizing:border-box; min-width:0; min-height:0; object-fit: contain; }
    button { padding:12px 24px; font-size:18px; cursor:pointer; background: #222; color: #eee; border: 2px solid #555; border-radius: 6px; transition: 0.2s; }
    button:hover { background: #333; border-color: #777; }
    button:active { background: #444; }
    #status { font-size:14px; color:#aaa; min-height: 1.2em; }

    #video { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <canvas id="output"></canvas>
    <div>
      <button id="startBtn">Iniciar camera</button>
    </div>
    <div id="status">Carregando...</div>
  </div>


  <video id="video" playsinline autoplay muted style="display:none;"></video>

  <!-- OpenCV.js -->
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="cvReady = true;"></script>

  <!-- Script principal do aplicativo -->
  <script type="module" src="script.js">
    
  </script>
</body>
</html>
